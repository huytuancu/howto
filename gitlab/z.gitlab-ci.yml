# gitlab-ci.yml sample file

stages:
  - build
  - test
  - deploy

variables:
  APP_NAME: "my-app"

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm test

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying $APP_NAME..."
    - echo "Deploy done!"
  only:
    - main
