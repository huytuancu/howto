# .gitlab-ci.yml sample file
# some basic notes
# Build > Pipelines: check result here

stages: # main stages for gitlab-ci
  - init
  - build
  - test
  - deploy

variables:
  APP_NAME: "my-app"
  ART_URL: "..."
  NAME_SPACE: "" # namespace on k8s
  

init:
  stage: init
  script:
    - |
      echo "$CI_PROJECT_DIR" > my_init.env
      echo "$CI_JOB_ID" >> my_init.env
      ...
  artifacts:
    report:
      dotenv: my_init.env

build:
  stage: build
  image: node:20
  needs:
    - job: init
      artifacts: true
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm test

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - | # can start writing bash from next line
      echo "Deploying $APP_NAME..."
      echo "Deploy done!"
  only:
    - main

include:
  - local: .gitlab/<your ci dir>/<your include>.yml # include external .yml file
